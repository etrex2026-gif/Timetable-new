name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: ${JAVA_MAJOR_VERSION}"
          if [ -z "${JAVA_MAJOR_VERSION}" ]; then
            echo "::error::Failed to detect Java version."
            exit 1
          fi
          if [ "${JAVA_MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Active Java version must be 17 or newer. Detected version: ${JAVA_MAJOR_VERSION}"
            exit 1
          fi
          echo "Java 17+ environment verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to generate temporary debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "${EXPECTED_APK}" ] && [ -s "${EXPECTED_APK}" ]; then
            echo "Verified debug APK exists: ${EXPECTED_APK}"
            ls -lh "${EXPECTED_APK}"
          else
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}"
            echo "Scanning app/build/outputs/apk for any files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "${ASSET_DIR}"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET_DIR}/app-debug.apk"
          if [ ! -f "${ASSET_DIR}/app-debug.apk" ] || [ ! -s "${ASSET_DIR}/app-debug.apk" ]; then
            echo "::error::Prepared release asset failed verification."
            exit 1
          fi
          echo "Prepared release asset: ${ASSET_DIR}/app-debug.apk"
          echo "asset_path=${ASSET_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Release asset is missing or empty: ${ASSET_PATH}"
            exit 1
          fi
          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "::error::Asset does not have .apk extension"; exit 1 ;;
          esac
          ASSET_NAME=$(basename "${ASSET_PATH}")
          if [ "${ASSET_NAME}" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got: ${ASSET_NAME}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK built by GitHub Actions
          - **GitHub Actions Run Number**: ${{ github.run_number }}
          - **GitHub Actions Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Notice**: This APK is intended for testing and evaluation purposes only.
          - **Signing**: Signed only with a temporary debug keystore (not a production release).
          EOF
          )

          echo "Creating release ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "${RELEASE_TAG}" || true
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "=========================================="
            echo "DIRECT APK DOWNLOAD URL:"
            echo "${DIRECT_URL}"
            echo "Asset: app-debug.apk"
            echo "Backup Actions artifact 'app-debug-apk' is also available."
            echo "=========================================="

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk](${DIRECT_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct link: \`${DIRECT_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> *Note: Backup Actions artifact \`app-debug-apk\` remains available.*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build was successful."
              echo "The debug APK artifact 'app-debug-apk' was uploaded and remains available in GitHub Actions."
            else
              echo "The APK was not produced."
            fi
          fi
